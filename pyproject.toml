[project]
name = "fractal-comp"
version = "0.1.0"
description = "Educational Partitioned Iterated Function System (PIFS) fractal image compression explorer"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "scipy>=1.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

